name: Secret Scan & Credential Protection

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ../.gitleaks.toml

      - name: Verify No Tracked Environment Secrets
        run: |
          echo "Verifying no active .env or credential files are tracked in git..."
          # Real .env files, keys and Firebase configs fail the build;
          # .env.example / .sample / .template files (blank values) are fine.
          if git ls-files \
            | grep -E '(^|/)\.env(\.[^/]+)?$|\.(key|pem|p12|jks|keystore)$|(^|/)serviceAccountKey\.json$|(^|/)google-services\.json$|(^|/)GoogleService-Info\.plist$' \
            | grep -vE '(^|/)\.env\.(example|sample|template)$'; then
            echo "ERROR: Sensitive credential files found tracked in Git!"
            exit 1
          else
            echo "All sensitive credential files are properly excluded from Git."
          fi
