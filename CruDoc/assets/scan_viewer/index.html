<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Scan viewer</title>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EEF0F3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c1c1e;touch-action:none}
canvas{display:block;width:100%;height:100%}
.bar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
button{font:600 13px system-ui;padding:8px 12px;border-radius:10px;border:1px solid #d6d9de;background:#fff;color:#1c1c1e;cursor:pointer}
button.on{background:#0a84ff;color:#fff;border-color:#0a84ff}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;text-align:center;padding:24px}
#msg.err{color:#c62828}
.spin{width:28px;height:28px;border:3px solid #cfd3d9;border-top-color:#0a84ff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#read{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #d6d9de;border-radius:10px;padding:7px 12px;font:600 13px system-ui;display:none}
</style></head>
<body>
<div class="bar" id="bar" style="display:none">
  <button id="bReset">Reset view</button>
  <button id="bWire">Wireframe</button>
  <button id="bMeasure">Measure</button>
</div>
<div id="read"></div>
<div id="msg"><div class="spin"></div><div>Loading scan...</div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const msg = document.getElementById('msg');
const fail = (t) => { msg.className = 'err'; msg.innerHTML = ''; msg.textContent = t; };
const text = (b, n) => new TextDecoder().decode(new Uint8Array(b, 0, Math.min(n, b.byteLength)));

function parseSTL(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength >= 84) {
    const n = dv.getUint32(80, true);
    if (84 + n * 50 === buf.byteLength) {
      const pos = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) { const o = 84 + i * 50 + 12; for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true); }
      return { pos };
    }
  }
  const s = new TextDecoder().decode(buf), out = [];
  const re = /vertex\s+(\S+)\s+(\S+)\s+(\S+)/g; let m;
  while ((m = re.exec(s))) out.push(+m[1], +m[2], +m[3]);
  if (!out.length || out.length % 9) throw new Error('Not a valid STL file.');
  return { pos: new Float32Array(out) };
}
function parseOBJ(buf) {
  const v = [], idx = [];
  for (const line of new TextDecoder().decode(buf).split('\n')) {
    const t = line.trim().split(/\s+/);
    if (t[0] === 'v') v.push(+t[1], +t[2], +t[3]);
    else if (t[0] === 'f') {
      const f = t.slice(1).map(x => { const i = parseInt(x); return i < 0 ? v.length / 3 + i : i - 1; });
      for (let i = 1; i + 1 < f.length; i++) idx.push(f[0], f[i], f[i + 1]);
    }
  }
  if (!v.length) throw new Error('No vertices found in OBJ.');
  return { pos: new Float32Array(v), index: idx.length ? idx : null };
}
function parsePLY(buf) {
  const head = text(buf, 16384), e = head.indexOf('end_header');
  if (e < 0) throw new Error('Not a valid PLY file.');
  let off = e + 'end_header'.length; const b = new Uint8Array(buf);
  if (b[off] === 13) off++;
  if (b[off] === 10) off++;
  const lines = head.slice(0, e).split(/\r?\n/);
  const fmt = (lines.find(l => l.startsWith('format')) || '').split(/\s+/)[1];
  const els = []; let cur;
  for (const l of lines) {
    const t = l.trim().split(/\s+/);
    if (t[0] === 'element') { cur = { name: t[1], n: +t[2], props: [] }; els.push(cur); }
    else if (t[0] === 'property' && cur) cur.props.push(t[1] === 'list' ? { list: true, ct: t[2], it: t[3], name: t[4] } : { type: t[1], name: t[2] });
  }
  const size = { char: 1, uchar: 1, int8: 1, uint8: 1, short: 2, ushort: 2, int16: 2, uint16: 2, int: 4, uint: 4, int32: 4, uint32: 4, float: 4, float32: 4, double: 8, float64: 8 };
  const dv = new DataView(buf), le = fmt === 'binary_little_endian';
  const rd = (t, o) => { switch (t) {
    case 'char': case 'int8': return dv.getInt8(o);
    case 'uchar': case 'uint8': return dv.getUint8(o);
    case 'short': case 'int16': return dv.getInt16(o, le);
    case 'ushort': case 'uint16': return dv.getUint16(o, le);
    case 'int': case 'int32': return dv.getInt32(o, le);
    case 'uint': case 'uint32': return dv.getUint32(o, le);
    case 'float': case 'float32': return dv.getFloat32(o, le);
    default: return dv.getFloat64(o, le); } };
  let pos = null; const idx = [];
  if (fmt === 'ascii') {
    const tk = new TextDecoder().decode(b.subarray(off)).split(/\s+/).filter(Boolean); let p = 0;
    for (const el of els) {
      if (el.name === 'vertex') pos = new Float32Array(el.n * 3);
      for (let i = 0; i < el.n; i++) {
        const vals = {};
        for (const pr of el.props) {
          if (pr.list) { const c = +tk[p++], a = []; for (let k = 0; k < c; k++) a.push(+tk[p++]); vals[pr.name] = a; }
          else vals[pr.name] = +tk[p++];
        }
        if (el.name === 'vertex') { pos[i * 3] = vals.x; pos[i * 3 + 1] = vals.y; pos[i * 3 + 2] = vals.z; }
        else if (el.name === 'face') { const f = vals.vertex_indices || vals.vertex_index; if (f) for (let k = 1; k + 1 < f.length; k++) idx.push(f[0], f[k], f[k + 1]); }
      }
    }
  } else if (le || fmt === 'binary_big_endian') {
    let o = off;
    for (const el of els) {
      if (el.name === 'vertex') pos = new Float32Array(el.n * 3);
      for (let i = 0; i < el.n; i++) {
        for (const pr of el.props) {
          if (pr.list) {
            const c = rd(pr.ct, o); o += size[pr.ct]; const a = [];
            for (let k = 0; k < c; k++) { a.push(rd(pr.it, o)); o += size[pr.it]; }
            if (el.name === 'face' && (pr.name === 'vertex_indices' || pr.name === 'vertex_index')) for (let k = 1; k + 1 < a.length; k++) idx.push(a[0], a[k], a[k + 1]);
          } else {
            if (el.name === 'vertex') { const k = { x: 0, y: 1, z: 2 }[pr.name]; if (k !== undefined) pos[i * 3 + k] = rd(pr.type, o); }
            o += size[pr.type];
          }
        }
      }
    }
  } else throw new Error('Unsupported PLY encoding.');
  if (!pos) throw new Error('No vertices found in PLY.');
  return { pos, index: idx.length ? idx : null };
}

const kind = (new URLSearchParams(location.search).get('fmt') || '').toLowerCase();
const tick = () => new Promise(r => setTimeout(r, 30));
try {
  const res = await fetch('/mesh');
  if (!res.ok) throw new Error('Could not read the scan file.');
  const buf = await res.arrayBuffer(); await tick();
  const parser = { stl: parseSTL, obj: parseOBJ, ply: parsePLY }[kind];
  if (!parser) throw new Error('Unsupported format: .' + kind + ' (use STL, PLY or OBJ).');
  const m = parser(buf); await tick();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.pos, 3));
  if (m.index) g.setIndex(m.pos.length / 3 > 65535 ? new THREE.Uint32BufferAttribute(m.index, 1) : new THREE.Uint16BufferAttribute(m.index, 1));
  const noFaces = !m.index && kind !== 'stl';
  g.center(); g.computeBoundingSphere();
  if (!noFaces) g.computeVertexNormals();
  const R = g.boundingSphere.radius || 1;

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, 1, R / 100, R * 100);
  const ren = new THREE.WebGLRenderer({ antialias: true });
  ren.setPixelRatio(Math.min(devicePixelRatio, 2)); ren.setClearColor(0xEEF0F3);
  document.body.prepend(ren.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0a8, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(1, 1.5, 2); cam.add(key); scene.add(cam);
  const mat = noFaces ? new THREE.PointsMaterial({ color: 0xE9DFCB, size: R / 400 })
    : new THREE.MeshStandardMaterial({ color: 0xE9DFCB, roughness: 0.85, metalness: 0, side: THREE.DoubleSide });
  const mesh = noFaces ? new THREE.Points(g, mat) : new THREE.Mesh(g, mat);
  scene.add(mesh);
  const ctl = new OrbitControls(cam, ren.domElement); ctl.enableDamping = true;
  const reset = () => { cam.position.set(0, 0, R * 2.6); ctl.target.set(0, 0, 0); ctl.update(); };
  reset();
  const fit = () => { const w = innerWidth, h = innerHeight; ren.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); };
  addEventListener('resize', fit); fit();
  (function loop() { requestAnimationFrame(loop); ctl.update(); ren.render(scene, cam); })();

  document.getElementById('bReset').onclick = reset;
  const bW = document.getElementById('bWire'); if (noFaces) bW.style.display = 'none';
  bW.onclick = () => { mat.wireframe = !mat.wireframe; bW.classList.toggle('on', mat.wireframe); };
  const bM = document.getElementById('bMeasure'), read = document.getElementById('read');
  let measuring = false, pts = [], marks = [], line = null;
  const clear = () => { marks.forEach(s => scene.remove(s)); marks = []; if (line) { scene.remove(line); line = null; } pts = []; };
  bM.onclick = () => { measuring = !measuring; bM.classList.toggle('on', measuring); clear(); read.style.display = measuring ? 'block' : 'none'; read.textContent = 'Tap two points on the surface'; };
  const ray = new THREE.Raycaster(), dn = { x: 0, y: 0, t: 0 };
  ren.domElement.addEventListener('pointerdown', e => { dn.x = e.clientX; dn.y = e.clientY; dn.t = Date.now(); });
  ren.domElement.addEventListener('pointerup', e => {
    if (!measuring || noFaces || Math.hypot(e.clientX - dn.x, e.clientY - dn.y) > 6 || Date.now() - dn.t > 500) return;
    ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)), cam);
    const hit = ray.intersectObject(mesh, false)[0]; if (!hit) return;
    if (pts.length >= 2) clear();
    pts.push(hit.point.clone());
    const s = new THREE.Mesh(new THREE.SphereGeometry(R / 120, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff3b30, depthTest: false }));
    s.renderOrder = 10; s.position.copy(hit.point); scene.add(s); marks.push(s);
    if (pts.length === 2) {
      line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff3b30, depthTest: false }));
      line.renderOrder = 10; scene.add(line);
      read.textContent = pts[0].distanceTo(pts[1]).toFixed(2) + ' mm';
    } else read.textContent = 'Tap the second point';
  });
  msg.style.display = 'none'; document.getElementById('bar').style.display = 'flex';
} catch (e) { fail(e.message || 'Could not open this scan.'); }
</script></body></html>
