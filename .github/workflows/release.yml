name: Release

# Publishes a CruDoc release that the apps update themselves from
# (CruDoc/lib/core/update): a Windows installer, a signed Android APK and
# the update.json that tells the apps which file to fetch and its checksum.
#
#   Every push to main releases automatically: the patch number goes up by
#   one from the latest v1.2.3 tag (add #minor or #major to any commit
#   message in the push to bump that part instead), the app is built and
#   published, and "what is new" is written from the commit messages.
#   Skip it for one push:  put [skip release] in the commit message.
#   Pushes that only change docs, handoff notes or *.md files are skipped.
#
#   Other ways to release:
#     Tag a commit:   git tag v1.1.0 && git push origin v1.1.0
#     or run it from GitHub: Actions > Release > Run workflow.
#
# A release is only published when the analyzer finds no errors and both the
# Windows and Android builds succeed. The tag the release creates does not
# start this workflow again (GitHub ignores pushes made with its own token).
#
# One-time setup of the secrets: CruDoc/tool/setup_release_secrets.ps1

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'CruDoc/docs/**'
      - 'CruDoc/handoff/**'
      - '.github/workflows/authorization_tests.yml'
      - '.github/workflows/secret_scan.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (blank: the next patch number, worked out automatically)'
        required: false
        type: string
      notes:
        description: 'What is new, shown in the update pop-up (blank: written from the commits)'
        required: false
        type: string
      force_update:
        description: 'Critical fix: the pop-up cannot be dismissed'
        required: false
        type: boolean
        default: false
      min_supported_version:
        description: 'Oldest version still allowed to run'
        required: false
        type: string
        default: '0.0.0'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    # A commit message with [skip release] publishes nothing.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          semver_tags() { git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname; }

          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            raw="$REF_NAME"                       # a tag you pushed by hand
          elif [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"                  # a version typed into Run workflow
          else
            raw=""                                # work it out below
          fi

          if [ -n "$raw" ]; then
            version="${raw#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$raw' is not a version like 1.2.3 or v1.2.3"
              exit 1
            fi
            # Notes: the commits since the newest other release.
            last="$(semver_tags | grep -vx "v$version" | head -1 || true)"
          else
            last="$(semver_tags | head -1 || true)"
            if [ -z "$last" ]; then
              version="1.0.0"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              msgs="$(git log "$last..HEAD" --pretty=%B)"
              if grep -qiE '#major' <<< "$msgs"; then
                major=$((major + 1)); minor=0; patch=0
              elif grep -qiE '#minor' <<< "$msgs"; then
                minor=$((minor + 1)); patch=0
              else
                patch=$((patch + 1))
              fi
              version="$major.$minor.$patch"
            fi
            # Never reuse a tag that already exists.
            while git rev-parse -q --verify "refs/tags/v$version" > /dev/null; do
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
            done
          fi

          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; fi
          notes="$(git log "$range" --no-merges --pretty='- %s' | grep -v '\[skip release\]' | head -30 || true)"

          echo "Releasing $version (previous: ${last:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # Nothing is published unless the code at least has no analyzer errors.
  check:
    name: Analyze
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CruDoc
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Git ignores this file, so it comes from a secret.
      - name: Write build config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            echo "::error::Secret FIREBASE_OPTIONS_DART_BASE64 is not set. Run CruDoc/tool/setup_release_secrets.ps1"
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART_BASE64" | tr -d '[:space:]' | base64 -d > lib/firebase_options.dart

      - run: flutter pub get

      # Errors stop the release; warnings and hints do not.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

  windows:
    name: Windows installer
    needs: [prepare, check]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: CruDoc
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Git ignores these, so they come from secrets.
      - name: Write build config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_DESKTOP_OAUTH_JSON_BASE64: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON_BASE64 }}
        run: |
          foreach ($n in 'FIREBASE_OPTIONS_DART_BASE64','GOOGLE_DESKTOP_OAUTH_JSON_BASE64') {
            if (-not (Get-Item "env:$n" -ErrorAction SilentlyContinue).Value) {
              throw "Secret $n is not set. Run CruDoc/tool/setup_release_secrets.ps1"
            }
          }
          [IO.File]::WriteAllBytes('lib/firebase_options.dart', [Convert]::FromBase64String($env:FIREBASE_OPTIONS_DART_BASE64))
          [IO.File]::WriteAllBytes('google_desktop_oauth.json', [Convert]::FromBase64String($env:GOOGLE_DESKTOP_OAUTH_JSON_BASE64))

      - run: flutter pub get

      - name: Build Windows app
        env:
          RUN_NUMBER: ${{ github.run_number }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: >
          flutter build windows --release
          --build-name=$env:VERSION --build-number=$env:RUN_NUMBER
          --dart-define-from-file=google_desktop_oauth.json
          --dart-define=GOOGLE_MAPS_API_KEY=$env:MAPS_KEY

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" ..\installer\CruDoc.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/output/CruDoc-windows-${{ env.VERSION }}.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: [prepare, check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CruDoc
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Git ignores these, so they come from secrets. The keystore must be
      # the same every release, or phones refuse to update the app.
      - name: Write build config and signing key
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for n in GOOGLE_SERVICES_JSON_BASE64 FIREBASE_OPTIONS_DART_BASE64 ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!n}" ]; then
              echo "::error::Secret $n is not set. Run CruDoc/tool/setup_release_secrets.ps1"
              exit 1
            fi
          done
          echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART_BASE64" | tr -d '[:space:]' | base64 -d > lib/firebase_options.dart
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
          {
            echo "storeFile=app/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: >
          flutter build apk --release
          --build-name="$VERSION" --build-number="$RUN_NUMBER"
          --dart-define=GOOGLE_MAPS_API_KEY="$MAPS_KEY"

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "CruDoc-android-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CruDoc/CruDoc-android-${{ env.VERSION }}.apk
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, windows, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write update.json
        env:
          NOTES: ${{ inputs.notes || needs.prepare.outputs.notes }}
          FORCE: ${{ inputs.force_update }}
          MIN_VERSION: ${{ inputs.min_supported_version }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os

          version = os.environ["VERSION"]

          def entry(name):
              path = os.path.join("dist", name)
              with open(path, "rb") as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              return {"asset": name, "sha256": digest, "size": os.path.getsize(path)}

          manifest = {
              "schemaVersion": 1,
              "version": version,
              "minSupportedVersion": os.environ.get("MIN_VERSION") or "0.0.0",
              "forceUpdate": os.environ.get("FORCE") == "true",
              "changelog": (os.environ.get("NOTES") or "").strip(),
              "platforms": {
                  "windows": entry(f"CruDoc-windows-{version}.exe"),
                  "android": entry(f"CruDoc-android-{version}.apk"),
              },
          }
          with open("dist/update.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Create the release
        env:
          NOTES: ${{ inputs.notes || needs.prepare.outputs.notes }}
        run: |
          args=("$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CruDoc $VERSION")
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--generate-notes); fi
          gh release create "${args[@]}"
