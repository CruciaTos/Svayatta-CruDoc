# Gitleaks Configuration for CruDoc
title = "CruDoc Secret Scanner Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for false positives or documentation examples"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^test/''',
  '''^CruDoc/test/''',
  '''^CruDoc/functions/test/''',
  '''^CruDoc/voice-receptionist/tests/''',
  '''\.example$''',
  '''\.sample$''',
  '''README\.md$''',
  # Minified CBCT viewer bundle: `{key:...,value:function}` class code, not secrets.
  '''^CruDoc/assets/cbct_viewer/a/''',
  # Minified dental 3D viewer bundle: same false positives as above.
  '''^CruDoc/assets/dental3d/assets/''',
]
regexes = [
  '''AIzaSy[0-9A-Za-z\-_]{33}[X_]{2}''',
  '''(?i)example''',
  '''(?i)dummy''',
  '''(?i)placeholder''',
]
fingerprints = [
  "2f11b704adee700bc90a6f3b355e1db7b5c4387e:CruDoc/lib/core/services/gemini_json_client.dart:google-gemini-api-key:32",
  "2f11b704adee700bc90a6f3b355e1db7b5c4387e:CruDoc/lib/core/services/gemini_json_client.dart:gcp-api-key:32",
  # A fake "sk_live_..." value in a test that checks secrets are masked.
  "2729e765fbea9f746650964154bd94396b361d32:CruDoc/voice-receptionist/tests/test_receptionist_lines.py:stripe-access-token:202",
  # A SharedPreferences key name ('v2d.cursorOffset'), not a credential.
  "103a04e9e39479666677569fa5546b18145fd01d:CruDoc/lib/features/radiology/viewer/viewer_prefs.dart:generic-api-key:234",
]

[[rules]]
id = "meta-whatsapp-token"
description = "Meta WhatsApp User or System Access Token"
regex = '''(?i)(?:whatsapp|meta)[_-]?(?:access[_-]?token|token)\s*[:=]\s*['"]?(EAAP[a-zA-Z0-9]{50,})['"]?'''
keywords = ["EAAP", "WHATSAPP_ACCESS_TOKEN"]

[[rules]]
id = "resend-api-key"
description = "Resend API Key"
regex = '''re_[a-zA-Z0-9_]{24,}'''
keywords = ["re_"]

[[rules]]
id = "google-gemini-api-key"
description = "Google Cloud / Gemini API Key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
keywords = ["AIza"]

[[rules]]
id = "twilio-auth-token"
description = "Twilio Auth Token"
regex = '''(?i)(?:twilio|auth)[_-]?token\s*[:=]\s*['"]?([0-9a-fA-F]{32})['"]?'''
keywords = ["twilio", "TWILIO_AUTH_TOKEN"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws_(?:secret_access_key|secret_key)\s*[:=]\s*['"]?([A-Za-z0-9/+=]{40})['"]?'''
keywords = ["aws_secret_access_key"]
