name: crudoc_j2k
description: "A Flutter FFI plugin for decoding JPEG 2000 and HTJ2K codestreams using OpenJPEG."
version: 0.0.1

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      windows:
        ffiPlugin: true