<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="doctor_management_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>doctor_management_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Google Maps JavaScript SDK — required for Flutter Web Maps and Places Autocomplete. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCvA7zLFFwUdL5xN9iqYy2uULtNnjH-NWo&libraries=places"></script>
  
  <script>
    window.googlePlacesAutocomplete = function(input, callback) {
      if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
        console.error('Google Maps Places library is not loaded.');
        callback(JSON.stringify([]));
        return;
      }
      var service = new google.maps.places.AutocompleteService();
      service.getPlacePredictions({
        input: input,
        componentRestrictions: { country: 'in' },
        types: ['geocode', 'establishment']
      }, function(predictions, status) {
        if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
          callback(JSON.stringify([]));
          return;
        }
        var results = predictions.map(function(p) {
          return {
            description: p.description,
            place_id: p.place_id,
            structured_formatting: {
              main_text: p.structured_formatting.main_text,
              secondary_text: p.structured_formatting.secondary_text
            }
          };
        });
        callback(JSON.stringify(results));
      });
    };

    window.googlePlaceDetails = function(placeId, callback) {
      if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
        console.error('Google Maps Places library is not loaded.');
        callback(null);
        return;
      }
      var dummy = document.createElement('div');
      var service = new google.maps.places.PlacesService(dummy);
      service.getDetails({
        placeId: placeId,
        fields: ['geometry', 'formatted_address']
      }, function(place, status) {
        if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
          callback(null);
          return;
        }
        var lat = place.geometry.location.lat();
        var lng = place.geometry.location.lng();
        var result = {
          formatted_address: place.formatted_address,
          geometry: {
            location: {
              lat: lat,
              lng: lng
            }
          }
        };
        callback(JSON.stringify(result));
      });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
