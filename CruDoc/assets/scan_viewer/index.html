<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Scan viewer</title>
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EEF0F3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c1c1e;touch-action:none}
canvas{display:block;width:100%;height:100%}
.bar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
button{font:600 13px system-ui;padding:8px 12px;border-radius:10px;border:1px solid #d6d9de;background:#fff;color:#1c1c1e;cursor:pointer}
button.on{background:#0a84ff;color:#fff;border-color:#0a84ff}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;text-align:center;padding:24px}
#msg.err{color:#c62828}
.spin{width:28px;height:28px;border:3px solid #cfd3d9;border-top-color:#0a84ff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#read{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #d6d9de;border-radius:10px;padding:7px 12px;font:600 13px system-ui;display:none}
#cmp{position:absolute;left:10px;right:10px;bottom:12px;margin:0 auto;max-width:440px;background:rgba(255,255,255,.95);border:1px solid #d6d9de;border-radius:14px;padding:10px 12px;font:13px system-ui;display:none;box-sizing:border-box}
#cmp .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#cmpInfo{font-weight:600;line-height:1.35}
#cmpWarn{color:#b26a00;font-weight:600;margin-top:6px;display:none}
#tolRow{margin-top:8px}
#tolRow input{width:100%;margin:6px 0 0;touch-action:pan-x}
#lgBar{height:10px;border-radius:5px;margin-top:8px}
#lgLab{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-top:3px}
#lgNote{font-size:11px;color:#555;margin-top:2px}
#cmp.busy button:not(#bExit),#cmp.busy input{pointer-events:none;opacity:.5}
</style></head>
<body>
<div class="bar" id="bar" style="display:none">
  <button id="bReset">Reset view</button>
  <button id="bWire">Wireframe</button>
  <button id="bMeasure">Measure</button>
  <button id="bCompare">Compare</button>
</div>
<div id="cmp">
  <div id="cmpInfo"></div>
  <div class="row"><button id="bMap" class="on">Colour map</button><button id="bOver">Overlay</button><button id="bSwap">Swap</button><button id="bSave" style="display:none">Save picture</button><button id="bExit">Exit</button></div>

  <div id="cmpWarn"></div>
</div>
<div id="read"></div>

    x.fillText('RMS ' + (isFinite(cmp.rms) ? cmp.rms.toFixed(2) + ' mm' : 'n/a'), W - pad, H + bar * 0.68);
    try { await h.callHandler('savePicture', { png: cv.toDataURL('image/png'), rms: isFinite(cmp.rms) ? cmp.rms : null }); } catch (e) {}
  };
  $('tol').oninput = e => { if (!cmp || !cmp.dev) return; cmp.tol = +e.target.value; $('tolV').textContent = cmp.tol.toFixed(2); recolor(); };
  function showDeviation(hit) {
    if (!cmp || !cmp.dev || !hit.face || cmp.busy) return;
    const pa = cmp.mesh.geometry.attributes.position, v = new THREE.Vector3(); let bi = -1, bd = Infinity;
    for (const i of [hit.face.a, hit.face.b, hit.face.c]) { v.fromBufferAttribute(pa, i); const dd = v.distanceToSquared(hit.point); if (dd < bd) { bd = dd; bi = i; } }
    const d = cmp.dev[bi];
    clearDevMark();
    devMark = new THREE.Mesh(new THREE.SphereGeometry(Rv / 120, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
    devMark.renderOrder = 10; devMark.position.copy(hit.point); scene.add(devMark);
    devLine = 'Deviation: ' + (d !== d ? 'no overlapping surface here' : (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(2) + ' mm' + (Math.abs(d) <= cmp.tol ? ' (within tolerance)' : d < 0 ? ' (material lost)' : ' (material gained)'));
    setInfo(cmp.head + '\n' + devLine, cmp.warn);
  }
  msg.style.display = 'none'; document.getElementById('bar').style.display = 'flex';
} catch (e) { fail(e.message || 'Could not open this scan.'); }
</script></body></html>
