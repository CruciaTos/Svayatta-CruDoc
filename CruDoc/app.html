<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26.2 — The AI Engineer Marathon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --asphalt:#14171D;
  --asphalt-2:#191D25;
  --panel:#20242E;
  --panel-2:#262B36;
  --line:rgba(244,239,228,0.09);
  --line-strong:rgba(244,239,228,0.16);
  --chalk:#F4EFE4;
  --chalk-dim:#9BA1AD;
  --chalk-faint:#6b7280;
  --bib:#FF5A3C;
  --bib-strong:#FF7A57;
  --bib-dim:rgba(255,90,60,0.14);
  --finish:#FFC53D;
  --finish-dim:rgba(255,197,61,0.14);
  --danger:#FF5A3C;
  --font-display:'Bebas Neue', sans-serif;
  --font-head:'Space Grotesk', sans-serif;
  --font-body:'Source Serif 4', Georgia, serif;
  --font-mono:'JetBrains Mono', monospace;
  --radius:14px;
  --radius-sm:8px;
  --sidebar-w:296px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--asphalt);
  color:var(--chalk);
  font-family:var(--font-head);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--bib);color:#14171D;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#33394a;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#454c62;}

:focus-visible{outline:2px solid var(--finish);outline-offset:2px;border-radius:4px;}

/* ============ LAYOUT ============ */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex:0 0 auto;
  background:var(--asphalt-2);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;
  overflow-y:auto;
  z-index:40;
}
.sidebar-brand{
  padding:22px 20px 14px;
  border-bottom:1px solid var(--line);
}
.brand-row{display:flex;align-items:baseline;gap:8px;}
.brand-num{font-family:var(--font-display);font-size:34px;line-height:1;color:var(--bib);letter-spacing:0.5px;}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--chalk);}
.brand-sub{margin-top:4px;font-size:11.5px;color:var(--chalk-dim);letter-spacing:0.3px;}

.sidebar-progress{padding:14px 20px;border-bottom:1px solid var(--line);}
.sp-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.sp-label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--chalk-dim);}
.sp-value{font-family:var(--font-mono);font-size:12px;color:var(--finish);}
.track-bar{height:6px;border-radius:6px;background:#2a2f3b;overflow:hidden;position:relative;}
.track-bar-fill{height:100%;background:linear-gradient(90deg,var(--bib),var(--finish));border-radius:6px;transition:width .5s ease;}

.sidebar-nav{flex:1;padding:8px 10px 20px;}
.nav-quicklinks{padding:6px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.nav-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--chalk-dim);text-decoration:none;
  background:transparent;border:none;width:100%;text-align:left;
}
.nav-link:hover{background:var(--panel);color:var(--chalk);}
.nav-link.active{background:var(--bib-dim);color:var(--bib-strong);font-weight:600;}
.nav-link .ic{width:16px;text-align:center;opacity:.85;font-size:13px;}

.phase-group{margin-bottom:2px;}
.phase-head{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 10px;border:none;background:transparent;border-radius:var(--radius-sm);
  color:var(--chalk);text-align:left;
}
.phase-head:hover{background:var(--panel);}
.phase-head .pnum{
  font-family:var(--font-mono);font-size:10.5px;color:var(--asphalt);
  background:var(--chalk-dim);width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.phase-head.done .pnum{background:var(--finish);}
.phase-head .ptitle{flex:1;font-size:13px;font-weight:600;}
.phase-head .pmile{font-family:var(--font-mono);font-size:9.5px;color:var(--chalk-faint);}
.phase-head .chev{font-size:10px;color:var(--chalk-faint);transition:transform .2s;}
.phase-group.open .chev{transform:rotate(90deg);}
.phase-topics{max-height:0;overflow:hidden;transition:max-height .25s ease;padding-left:8px;}
.phase-group.open .phase-topics{max-height:2000px;}
.topic-group-label{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--chalk-faint);padding:8px 10px 3px;}
.topic-link{
  display:flex;align-items:center;gap:8px;
  padding:6.5px 10px 6.5px 30px;border-radius:var(--radius-sm);
  font-size:12.7px;color:var(--chalk-dim);text-decoration:none;border:none;background:transparent;width:100%;text-align:left;
}
.topic-link:hover{background:var(--panel);color:var(--chalk);}
.topic-link.active{background:var(--bib-dim);color:var(--bib-strong);}
.topic-check{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--chalk-faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9px;}
.topic-check.done{background:var(--finish);border-color:var(--finish);color:var(--asphalt);}
.topic-link .flag{margin-left:auto;font-size:10px;color:var(--finish);opacity:.8;}
.topic-link .bookmark-dot{margin-left:auto;font-size:10px;color:var(--bib);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(20,23,29,0.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:12px 28px;display:flex;align-items:center;gap:16px;
}
.menu-btn{display:none;background:none;border:1px solid var(--line-strong);color:var(--chalk);border-radius:8px;width:36px;height:36px;font-size:16px;}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;
}
.search-box input{background:none;border:none;color:var(--chalk);font-family:var(--font-head);font-size:13.5px;width:100%;outline:none;}
.search-box input::placeholder{color:var(--chalk-faint);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.streak-pill{
  display:flex;align-items:center;gap:6px;background:var(--finish-dim);color:var(--finish);
  padding:6px 12px;border-radius:20px;font-family:var(--font-mono);font-size:12px;font-weight:600;
}

.content{flex:1;padding:32px 40px 80px;max-width:1180px;width:100%;margin:0 auto;}
@media (max-width:900px){
  .content{padding:20px 18px 60px;}
  .topbar{padding:10px 16px;}
}

/* ============ SEARCH RESULTS ============ */
.search-results{position:fixed;inset:0;background:rgba(10,11,15,0.7);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:80px 20px;}
.search-panel{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);width:100%;max-width:640px;max-height:70vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.search-panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}
.search-panel-head input{flex:1;background:none;border:none;color:var(--chalk);font-family:var(--font-head);font-size:16px;outline:none;}
.search-result-item{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);}
.search-result-item:hover{background:var(--panel-2);cursor:pointer;}
.search-result-item .srt{font-weight:600;font-size:13.5px;}
.search-result-item .srp{margin-left:auto;font-size:10.5px;color:var(--chalk-faint);font-family:var(--font-mono);}

/* ============ HERO / MARATHON TRACK ============ */
.hero{
  background:linear-gradient(180deg,#1B1F27 0%,#171B22 100%);
  border:1px solid var(--line);border-radius:20px;
  padding:28px 28px 8px;margin-bottom:28px;position:relative;overflow:hidden;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:6px;}
.hero-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--bib-strong);font-weight:700;}
.hero-title{font-family:var(--font-display);font-size:44px;line-height:1;margin:6px 0 4px;letter-spacing:.5px;}
.hero-sub{color:var(--chalk-dim);font-size:13.5px;max-width:520px;}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;}
.hstat{text-align:right;}
.hstat .hv{font-family:var(--font-mono);font-size:22px;color:var(--finish);font-weight:600;}
.hstat .hl{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--chalk-faint);}

.track-wrap{margin-top:10px;position:relative;}
.track-svg{width:100%;height:auto;display:block;}
.mile-label{font-family:var(--font-mono);font-size:10px;fill:var(--chalk-faint);}
.mile-label.done{fill:var(--finish);}
.mile-tag{font-family:var(--font-head);font-size:9.5px;fill:var(--chalk-dim);font-weight:600;}

.hero-legend{display:flex;gap:18px;padding:10px 4px 18px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--chalk-dim);}
.legend-dot{width:9px;height:9px;border-radius:50%;}

/* ============ DASHBOARD GRID ============ */
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:28px;}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--chalk);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.continue-row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--radius-sm);background:var(--asphalt-2);border:1px solid var(--line);margin-bottom:10px;}
.continue-row .ctitle{font-weight:600;font-size:14px;}
.continue-row .cphase{font-size:11px;color:var(--chalk-dim);}
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  padding:9px 16px;border-radius:9px;border:none;font-family:var(--font-head);font-weight:600;font-size:12.5px;
  letter-spacing:.3px;
}
.btn-primary{background:var(--bib);color:#1a0d08;}
.btn-primary:hover{background:var(--bib-strong);}
.btn-ghost{background:var(--panel-2);color:var(--chalk);border:1px solid var(--line-strong);}
.btn-ghost:hover{border-color:var(--chalk-dim);}
.btn-gold{background:var(--finish);color:#241a02;}
.btn-sm{padding:6px 11px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.leg-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.leg-row:last-child{border-bottom:none;}
.leg-badge{font-family:var(--font-mono);font-size:10px;width:22px;height:22px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.leg-badge.done{background:var(--finish);color:#241a02;}
.leg-name{flex:1;font-size:12.5px;}
.leg-pct{font-family:var(--font-mono);font-size:11px;color:var(--chalk-dim);}

/* ============ PHASE PAGE ============ */
.breadcrumb{font-size:11.5px;color:var(--chalk-faint);margin-bottom:10px;font-family:var(--font-mono);}
.breadcrumb a{color:var(--chalk-dim);text-decoration:none;}
.breadcrumb a:hover{color:var(--bib-strong);}
.phase-header{margin-bottom:24px;}
.phase-header .peyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--bib-strong);font-weight:700;}
.phase-header h1{font-family:var(--font-display);font-size:40px;margin:6px 0;letter-spacing:.5px;}
.phase-header p{color:var(--chalk-dim);font-size:14px;max-width:640px;line-height:1.6;}
.topic-table{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.tt-group-label{background:var(--asphalt-2);padding:10px 18px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--chalk-dim);font-weight:700;}
.tt-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel);}
.tt-row:hover{background:var(--panel-2);cursor:pointer;}
.tt-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--chalk-faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.tt-check.done{background:var(--finish);border-color:var(--finish);color:#241a02;}
.tt-title{flex:1;font-size:14px;font-weight:600;}
.tt-flag{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bib-dim);color:var(--bib-strong);font-weight:700;letter-spacing:.3px;}
.tt-flag.stub{background:var(--panel-2);color:var(--chalk-faint);}
.tt-arrow{color:var(--chalk-faint);}

.takeaway-box{background:var(--asphalt-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:24px;}
.takeaway-box h3{margin:0 0 10px;font-size:14px;}
.takeaway-box ul{margin:0;padding-left:18px;color:var(--chalk-dim);font-size:13.5px;line-height:1.9;}
.next-phase-cta{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(255,90,60,.1),rgba(255,197,61,.08));border:1px solid var(--line-strong);border-radius:var(--radius);padding:18px 22px;margin-top:20px;}

/* ============ TOPIC PAGE ============ */
.topic-header{margin-bottom:8px;}
.topic-header .teyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--bib-strong);font-weight:700;}
.topic-header h1{font-family:var(--font-display);font-size:42px;margin:4px 0 10px;letter-spacing:.4px;line-height:1;}
.topic-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 30px;padding-bottom:22px;border-bottom:1px solid var(--line);}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line-strong);color:var(--chalk-dim);padding:8px 14px;border-radius:9px;font-size:12px;font-weight:600;}
.icon-btn:hover{color:var(--chalk);border-color:var(--chalk-dim);}
.icon-btn.on{background:var(--finish-dim);color:var(--finish);border-color:transparent;}
.icon-btn.bm-on{background:var(--bib-dim);color:var(--bib-strong);border-color:transparent;}

.tsec{margin-bottom:34px;}
.tsec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.tsec-num{font-family:var(--font-mono);font-size:12px;color:var(--finish);}
.tsec-head h2{font-family:var(--font-head);font-size:19px;margin:0;letter-spacing:.2px;}
.tsec-body{font-family:var(--font-body);font-size:16px;line-height:1.75;color:#E4E0D6;}
.tsec-body p{margin:0 0 12px;}
.tsec-body ul,.tsec-body ol{padding-left:22px;line-height:1.85;}
.tsec-body li{margin-bottom:6px;}
.tsec-body strong{color:var(--finish);font-weight:600;}
.concept-block{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bib);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:14px 18px;margin-bottom:12px;}
.concept-block h4{margin:0 0 6px;font-family:var(--font-head);font-size:14px;color:var(--chalk);}
.concept-block p{margin:0;font-size:14.5px;color:var(--chalk-dim);font-family:var(--font-body);line-height:1.7;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:700px){.two-col{grid-template-columns:1fr;}}
.pill-list{list-style:none;margin:0;padding:0;}
.pill-list li{display:flex;gap:8px;padding:8px 0;font-size:14px;color:var(--chalk-dim);border-bottom:1px solid var(--line);}
.pill-list.adv li::before{content:"+";color:var(--finish);font-weight:700;}
.pill-list.lim li::before{content:"–";color:var(--bib-strong);font-weight:700;}
.pill-list.mist li::before{content:"!";color:var(--bib-strong);font-weight:700;}

.viz-suggest{display:flex;gap:10px;flex-wrap:wrap;}
.viz-chip{background:var(--panel-2);border:1px dashed var(--line-strong);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--chalk-dim);display:flex;align-items:center;gap:6px;}

.iq-block{margin-bottom:16px;}
.iq-level{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;color:var(--finish);margin-bottom:8px;}
.iq-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;}
.iq-q{padding:12px 16px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.iq-q:hover{background:var(--panel-2);cursor:pointer;}
.iq-a{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .2s ease;font-family:var(--font-body);font-size:14.5px;color:var(--chalk-dim);line-height:1.7;}
.iq-item.open .iq-a{max-height:400px;padding:0 16px 14px;}
.iq-chevron{color:var(--chalk-faint);font-size:11px;flex:0 0 auto;}

.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:800px){.resource-grid{grid-template-columns:1fr;}}
.res-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;}
.res-card .rlvl{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--bib-strong);font-weight:700;margin-bottom:6px;}
.res-card .rname{font-weight:600;font-size:13.5px;margin-bottom:3px;}
.res-card .rby{font-size:11.5px;color:var(--chalk-faint);}

.read-list{list-style:none;margin:0;padding:0;}
.read-list li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.read-list .rtag{font-family:var(--font-mono);font-size:9.5px;color:var(--finish);flex:0 0 92px;text-transform:uppercase;letter-spacing:.5px;}
.read-list a{color:var(--chalk);text-decoration:none;border-bottom:1px solid var(--line-strong);}
.read-list a:hover{color:var(--bib-strong);border-color:var(--bib-strong);}

.repo-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.repo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
.repo-name{font-family:var(--font-mono);font-weight:600;font-size:14px;}
.repo-name a{color:var(--chalk);text-decoration:none;}
.repo-name a:hover{color:var(--bib-strong);}
.repo-diff{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;padding:3px 9px;border-radius:20px;font-weight:700;}
.repo-diff.Beginner{background:var(--finish-dim);color:var(--finish);}
.repo-diff.Intermediate{background:var(--bib-dim);color:var(--bib-strong);}
.repo-diff.Advanced{background:rgba(244,239,228,.1);color:var(--chalk-dim);}
.repo-card p{margin:5px 0;font-size:13.5px;color:var(--chalk-dim);line-height:1.6;}
.repo-card .rlabel{color:var(--chalk-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px;}

.exercise-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.exercise-item:last-child{border-bottom:none;}
.exercise-num{font-family:var(--font-mono);color:var(--finish);font-size:13px;flex:0 0 auto;}

/* ============ QUIZ ============ */
.quiz-box{background:var(--asphalt-2);border:1px solid var(--line-strong);border-radius:var(--radius);padding:22px;}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.quiz-progress .qp-text{font-family:var(--font-mono);font-size:11.5px;color:var(--chalk-dim);}
.qbar{height:5px;background:#2a2f3b;border-radius:6px;flex:1;margin:0 14px;overflow:hidden;}
.qbar-fill{height:100%;background:var(--bib);transition:width .3s;}
.quiz-q{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.5;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.quiz-opt{text-align:left;background:var(--panel);border:1.5px solid var(--line-strong);color:var(--chalk);padding:12px 14px;border-radius:9px;font-size:14px;font-family:var(--font-body);}
.quiz-opt:hover:not(:disabled){border-color:var(--chalk-dim);}
.quiz-opt.correct{background:rgba(255,197,61,.14);border-color:var(--finish);color:var(--finish);}
.quiz-opt.wrong{background:rgba(255,90,60,.14);border-color:var(--bib);color:var(--bib-strong);}
.quiz-opt:disabled{cursor:default;}
.quiz-explain{background:var(--panel);border-left:3px solid var(--finish);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--chalk-dim);margin-bottom:16px;line-height:1.6;}
.quiz-result{text-align:center;padding:30px 10px;}
.quiz-result .qr-score{font-family:var(--font-display);font-size:56px;color:var(--finish);line-height:1;}
.quiz-result .qr-label{color:var(--chalk-dim);font-size:13px;margin-top:6px;}

/* ============ FLASHCARDS ============ */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0;}
.fc-card{width:100%;max-width:480px;height:260px;perspective:1200px;}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.fc-card.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:18px;line-height:1.5;}
.fc-front{background:var(--panel);}
.fc-back{background:var(--bib-dim);transform:rotateY(180deg);color:var(--chalk);font-family:var(--font-body);font-size:16px;}
.fc-tag{position:absolute;top:14px;left:16px;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--chalk-faint);}
.fc-controls{display:flex;gap:10px;}

/* ============ EMPTY / STUB ============ */
.stub-box{background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:22px;margin-top:6px;}
.stub-desc{font-family:var(--font-body);font-size:16px;line-height:1.7;color:#E4E0D6;margin-bottom:16px;}
.stub-resource{font-size:13px;color:var(--chalk-dim);margin-bottom:16px;}
.stub-resource strong{color:var(--chalk);}

/* ============ MASTERS ============ */
.master-track{border-left:2px solid var(--line-strong);padding-left:22px;margin-left:8px;}
.master-item{position:relative;padding-bottom:26px;}
.master-item::before{content:"";position:absolute;left:-27px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--finish);border:2px solid var(--asphalt);}
.master-source{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--bib-strong);font-weight:700;margin-bottom:6px;}
.master-item h3{margin:0 0 6px;font-size:16px;}
.master-meta{display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--chalk-faint);margin-bottom:8px;flex-wrap:wrap;}
.master-item p{font-family:var(--font-body);font-size:14.5px;color:var(--chalk-dim);line-height:1.7;margin:0 0 6px;}

/* ============ TOASTS ============ */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:320px;}
.toast{
  background:var(--panel);border:1px solid var(--finish);border-radius:12px;padding:14px 16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:toast-in .35s ease;
}
.toast .tt1{font-weight:700;font-size:13.5px;color:var(--finish);margin-bottom:2px;}
.toast .tt2{font-size:12px;color:var(--chalk-dim);}
@keyframes toast-in{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast.leaving{animation:toast-out .3s ease forwards;}
@keyframes toast-out{to{opacity:0;transform:translateX(20px);}}

/* ============ MISC ============ */
.empty-state{text-align:center;padding:60px 20px;color:var(--chalk-dim);}
.empty-state .es-icon{font-size:40px;margin-bottom:14px;}
.notes-area{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;color:var(--chalk);font-family:var(--font-body);font-size:14px;line-height:1.6;resize:vertical;min-height:90px;}
.notes-area:focus{outline:none;border-color:var(--bib);}
.save-hint{font-size:10.5px;color:var(--chalk-faint);margin-top:6px;font-family:var(--font-mono);}
.section-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.badge-count{font-family:var(--font-mono);font-size:11px;color:var(--chalk-dim);background:var(--panel-2);padding:4px 10px;border-radius:20px;}

.runner-run{animation:runner-bob 0.6s ease-in-out infinite alternate;}
@keyframes runner-bob{from{transform:translateY(0);}to{transform:translateY(-3px);}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

@media (max-width:900px){
  .sidebar{position:fixed;left:-320px;top:0;bottom:0;transition:left .25s ease;box-shadow:20px 0 40px rgba(0,0,0,.4);}
  .sidebar.open{left:0;}
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  .hero-title{font-size:32px;}
  .resource-grid{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
}

FLAGSHIP['backpropagation'] = {
  intro:"Backpropagation is the algorithm that efficiently computes the gradient of a network's loss with respect to every single weight, by applying the chain rule backward through the network, layer by layer — telling gradient descent exactly which direction to nudge each weight.",
  why:"A modern network can have millions or billions of weights. Naively estimating each weight's effect on the loss by perturbing it individually and re-running the whole network would take millions of forward passes per training step. Backpropagation computes every single gradient in roughly the same time as one forward pass, which is the only reason training deep networks is computationally feasible at all.",
  concepts:[
    {h:"The forward pass", p:"Data flows through the network layer by layer, producing activations at each step, ending in a prediction and a loss value that measures how wrong that prediction was."},
    {h:"The chain rule, applied repeatedly", p:"The derivative of the loss with respect to an early weight is the product of local derivatives along the path connecting that weight to the loss. Backprop is nothing more than the chain rule applied systematically, layer by layer."},
    {h:"The backward pass", p:"Starting at the loss and working backward, each layer computes the gradient of the loss with respect to its own inputs using the gradient it received from the layer after it — reusing already-computed values instead of recomputing from scratch, which is what makes it efficient."},
    {h:"The computational graph", p:"Think of the entire network as a graph of mathematical operations. Backpropagation is exactly reverse-mode automatic differentiation applied to that graph — this is precisely what PyTorch's autograd and TensorFlow's GradientTape do automatically."},
    {h:"Vanishing and exploding gradients", p:"Because gradients are products of many local derivatives multiplied together across layers, they can shrink toward zero or blow up as they propagate backward through many layers — a major reason activation function choice, normalization layers, and residual connections matter so much in deep architectures."},
  ],
  visual:["A computational graph with forward arrows (data) and backward arrows (gradients) drawn in a different color","A 2-layer network diagram showing the chain-rule product explicitly, term by term","An animation of gradients shrinking or growing as they flow backward through many stacked layers"],
  math:"For a simple chain input → hidden → output → loss, the gradient of the loss with respect to the input weight is: (∂loss/∂weight) = (∂loss/∂output) × (∂output/∂hidden) × (∂hidden/∂weight). Each factor is a 'local' derivative that's easy to compute on its own; backprop's contribution is simply multiplying these local derivatives together in the right order, reusing each one exactly once as it propagates backward through the whole network.",
  realworld:["Every deep learning model in production — image classifiers, LLMs, diffusion models, speech models — is trained using backpropagation under the hood","Framework autograd engines (PyTorch, TensorFlow, JAX) exist specifically to automate this so practitioners never hand-derive gradients","Debugging a model that isn't learning often comes down to diagnosing a vanishing or exploding gradient problem inside its backward pass"],

  limitations:["Requires every operation in the computation graph to be differentiable (or worked around, e.g. straight-through estimators)","Prone to vanishing or exploding gradients in naively deep networks without architectural safeguards","Requires storing intermediate activations from the forward pass in memory to reuse during the backward pass","Inherently sequential backward through layers, which limits how much of it can be parallelized across depth"],

FLAGSHIP['attention'] = {
  intro:"Attention lets a model, when producing each output, look back at every input position and decide — dynamically, per token — how much weight to give each one. Instead of compressing an entire input sequence into one fixed-size vector, the model keeps direct access to everything and learns what to focus on.",
  why:"Older sequence models had to squeeze an entire sentence into a single fixed-size hidden state passed step by step, which became a bottleneck: information from early tokens faded before reaching the end of a long sequence. Attention removes that bottleneck entirely, giving the model direct, weighted access to every position at once — which is also the key insight that made the Transformer architecture, and every modern LLM built on it, possible.",
  concepts:[
    {h:"Query, Key, and Value vectors", p:"Every token is projected into three separate vectors: a Query ('what am I looking for'), a Key ('what do I represent, so others can find me'), and a Value ('what information do I actually carry if you attend to me')."},
    {h:"Attention scores via dot product", p:"A token's Query is compared against every other token's Key using a dot product — a simple, fast way to measure how relevant two vectors are to each other."},
    {h:"Softmax normalization", p:"Raw dot-product scores are passed through softmax, turning them into a clean probability distribution over all positions that sums to 1 — interpretable weights rather than arbitrary numbers."},
    {h:"Weighted sum of Values", p:"The output for a token is the weighted sum of every token's Value vector, weighted by the attention scores just computed — so more relevant tokens contribute proportionally more information."},
    {h:"Multi-head attention", p:"Rather than computing attention once, the model runs several attention computations in parallel ('heads'), each with its own learned Q/K/V projections, letting different heads specialize in different kinds of relationships — one might track syntax, another long-range coreference — before their outputs are concatenated."},
    {h:"Self-attention vs. cross-attention", p:"Self-attention relates tokens within the same sequence to each other (how GPT-style models work). Cross-attention relates tokens in one sequence to a different sequence — e.g. a translation decoder attending back to the original encoder's output."},
  ],
  visual:["An attention-weight heatmap over a sentence, showing which words attend strongly to which","A diagram of a single token's Query, Key, and Value vectors being computed and compared","A multi-head attention diagram showing several parallel heads before concatenation","An animation of one token's output being built as a weighted sum of every other token's Value vector"],
  math:"Attention(Q, K, V) = softmax(QKᵀ / √d_k) V. Step by step: QKᵀ computes a similarity score between every query and every key. Dividing by √d_k (the key dimension) keeps those scores from growing too large as dimensionality increases, which would otherwise push softmax into a region with vanishingly small gradients. softmax then turns the scores into normalized weights, and multiplying by V produces the final weighted sum — that whole expression is the entire mechanism.",
  realworld:["Every modern LLM — GPT, Claude, Gemini, Llama — uses multi-head self-attention as its core building block","Machine translation systems use cross-attention so the decoder can look back at the relevant part of the source sentence","Multimodal vision-language models use attention to let text tokens 'look at' relevant regions of an image"],
  advantages:["No fixed-size bottleneck — any two positions can relate to each other directly, regardless of distance between them","Highly parallelizable during training, unlike an RNN's inherently sequential dependency","Multi-head design lets different heads specialize in different types of relationships","Scales remarkably well with more data and compute, which is a major reason it underlies today's largest models"],
  limitations:["Computational cost grows quadratically with sequence length, since every token computes a score against every other token","This quadratic cost makes very long contexts expensive in both compute and memory","Attention weights are intuitive to visualize but aren't always a reliable explanation of the model's actual reasoning","Attention itself has no notion of order, so positional information has to be added separately (positional encodings)"],
  mistakes:["Forgetting the 1/√d_k scaling factor, which can destabilize softmax gradients, especially in larger models","Over-interpreting attention weights as a definitive causal explanation of why the model produced an answer","Confusing self-attention with cross-attention when reading an architecture diagram or paper","Not accounting for the O(n²) cost when planning for very long input sequences or designing a system around them"],
  interview:{
    beginner:[
